name: Build release APK
# Build the Smart AutoClicker release APK.
# Trigger: manual (Actions > Build release APK > Run workflow) or on push.
on:
  workflow_dispatch:
  push:
    branches:
      - master
      - arena/019fc387-clickernew   # remove this line once the PR is merged
jobs:
  build:
    name: Build release APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Gradle 8.2 + AGP 8.1.2 require JDK 17 (JDK 21 is NOT supported).
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'
      # The detection engine contains native C++ code (CMake/OpenCV).
      - name: Set up NDK
        shell: bash
        run: |
          echo "ANDROID_NDK=$ANDROID_NDK_LATEST_HOME" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=$ANDROID_NDK_LATEST_HOME" >> $GITHUB_ENV
      - name: Build release APK
        run: ./gradlew assembleRelease
      # Debug APK: signed with the debug key, directly installable on a device.
      - name: Build debug APK
        run: ./gradlew assembleDebug
      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: smartautoclicker-apks
          path: |
            smartautoclicker/build/outputs/apk/release/*.apk
            smartautoclicker/build/outputs/apk/debug/*.apk
