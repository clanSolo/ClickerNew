name: Build release APK
# Build the Smart AutoClicker release APK (signed) and a debug APK.
# Trigger: manual (Actions > Build release APK > Run workflow) or on push.
on:
  workflow_dispatch:
  push:
    branches:
      - master
      - arena/019fc387-clickernew   # remove this line once the PR is merged
jobs:
  build:
    name: Build release APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Gradle 8.2 + AGP 8.1.2 require JDK 17 (JDK 21 is NOT supported).
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'
      # The detection engine contains native C++ code (CMake/OpenCV).
      - name: Set up NDK
        shell: bash
        run: |
          echo "ANDROID_NDK=$ANDROID_NDK_LATEST_HOME" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=$ANDROID_NDK_LATEST_HOME" >> $GITHUB_ENV
      # Recreate the release keystore from the RELEASE_KEYSTORE_BASE64 secret.
      # If the secret is not set, the release APK will be built unsigned.
      - name: Restore release keystore
        env:
          KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > smartautoclicker/smartautoclicker.jks
            echo "Release keystore restored: signing enabled"
          else
            echo "No RELEASE_KEYSTORE_BASE64 secret found: building unsigned"
          fi
      - name: Build release APK
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          ./gradlew \
            -PsigningStorePassword="$SIGNING_STORE_PASSWORD" \
            -PsigningKeyAlias="$SIGNING_KEY_ALIAS" \
            -PsigningKeyPassword="$SIGNING_KEY_PASSWORD" \
            assembleRelease
      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: smartautoclicker-apks
          path: |
            smartautoclicker/build/outputs/apk/release/*.apk
